[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qatar-pii-scan"
version = "0.1.0"
description = "Find Qatar IDs, phone numbers, IBANs, emails and names in code, logs, CSV, Excel and JSON"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohaned Elhagar" }]
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
qpii = "qatar_pii_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
